<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tetris</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="wrapper">
    <h1 class="game-title">TETRIS</h1>
    <div class="game-container">
      <canvas id="board" width="300" height="600"></canvas>

      <aside class="panel">
        <div class="panel-section theme-toggle">
          <span class="label">MODO CLARO</span>
          <label class="switch">
            <input type="checkbox" id="theme-toggle" />
            <span class="slider"></span>
          </label>
        </div>

        <div class="panel-section">
          <span class="label">SCORE</span>
          <span class="value" id="score">0</span>
        </div>
        <div class="panel-section">
          <span class="label">LINES</span>
          <span class="value" id="lines">0</span>
        </div>
        <div class="panel-section">
          <span class="label">LEVEL</span>
          <span class="value" id="level">1</span>
        </div>

        <div class="panel-section">
          <span class="label">NEXT</span>
          <canvas id="next-canvas" width="120" height="120"></canvas>
        </div>

        <div class="panel-section controls">
          <span class="label">CONTROLS</span>
          <ul>
            <li><kbd>←</kbd><kbd>→</kbd> mover</li>
            <li><kbd>↑</kbd> rotar</li>
            <li><kbd>↓</kbd> bajar</li>
            <li><kbd>Space</kbd> caída</li>
            <li><kbd>P</kbd> pausa</li>
          </ul>
        </div>
      </aside>
    </div>

    <div id="overlay" class="overlay hidden">
      <div class="overlay-box">
        <p id="overlay-title">GAME OVER</p>
        <p id="overlay-score"></p>
        <div id="highscore-form" class="highscore-form hidden">
          <span class="label">¡Nuevo record! Ingresa tu nombre</span>
          <input type="text" id="name-input" maxlength="12" placeholder="JUGADOR" autocomplete="off" />
          <button id="save-score-btn">Guardar</button>
        </div>
        <div id="overlay-highscores" class="highscore-list hidden"></div>
        <button id="restart-btn">Reiniciar</button>
      </div>
    </div>

    <div id="start-overlay" class="overlay">
      <div class="overlay-box start-box">
        <p class="start-title">TETRIS</p>
        <span class="label">TOP 5</span>
        <div id="start-highscores" class="highscore-list"></div>
        <div class="stats-row">
          <div class="stat">
            <span class="label">MEJOR COMBO</span>
            <span class="value" id="stat-combo">0</span>
          </div>
          <div class="stat">
            <span class="label">MÁX. LÍNEAS</span>
            <span class="value" id="stat-lines">0</span>
          </div>
        </div>
        <button id="play-btn">JUGAR</button>
        <button id="reset-scores-btn">Resetear records</button>
      </div>
    </div>
  </div>

  <script src="game.js"></script>
</body>
</html>
